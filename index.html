<title>Conversation Examples Library · TalkAbroad</title>

<style>
  /* TalkAbroad style guide tokens */
  :root {
    --blue: #006BFD;          /* Primary 1 */
    --navy: #122634;          /* Primary 2 */
    --orange: #D14900;        /* Primary 3 / primary button */
    --orange-bright: #FB4B00; /* secondary + tertiary buttons */
    --green: #17AA3D;
    --yellow: #FCC71D;
    --n800: #25272A; --n700: #3C3E43; --n600: #686D76; --n500: #80858F;
    --n400: #9A9EA5; --n300: #D9D9D9; --n200: #F2F2F2; --n100: #FFFFFF;
    --font-body: "Aeonik", "Aeoniktrial", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-head: "Nib", "Nib trial", Georgia, "Times New Roman", serif;
    --radius-pill: 200px;
    --radius-card: 16px;
    --shadow: 1px 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(18,38,52,.06);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: var(--font-body); color: var(--navy); background: var(--n100);
    font-size: 18px; line-height: 1.5; letter-spacing: -0.2px; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header.top { border-bottom: 1px solid var(--n300); background: var(--n100); position: sticky; top: 0; z-index: 10; }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
  .logo { height: 26px; width: auto; display: block; }
  .logo-link { display: block; line-height: 0; }
  .ui-lang { display: inline-flex; border: 1px solid var(--n300); border-radius: var(--radius-pill); padding: 3px; }
  .ui-lang button {
    border: 0; background: transparent; color: var(--n600); font-size: 14px; font-weight: 500;
    padding: 6px 14px; border-radius: var(--radius-pill); cursor: pointer;
  }
  .ui-lang button[aria-pressed="true"] { background: var(--navy); color: #fff; }

  /* Hero */
  .hero { background: var(--n200); padding: 48px 0 40px; }
  .eyebrow { color: var(--orange); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }
  h1 { font-family: var(--font-head); font-weight: 600; font-size: clamp(36px, 5vw, 56px); line-height: 1.05; letter-spacing: -2px; margin: 0 0 16px; color: var(--n800); }
  .lede { font-size: 20px; line-height: 1.45; max-width: 760px; margin: 0 0 24px; color: var(--navy); }
  .notice {
    display: flex; gap: 14px; align-items: flex-start; background: #fff; border-left: 4px solid var(--blue);
    border-radius: 8px; padding: 14px 18px; max-width: 860px; font-size: 15px; line-height: 1.5; color: var(--n700);
    box-shadow: var(--shadow);
  }
  .notice svg { flex: none; margin-top: 2px; }
  .notice strong { color: var(--navy); }

  /* Controls */
  .controls { padding: 28px 0 8px; display: grid; gap: 18px; }
  .control-label { font-size: 13px; font-weight: 600; color: var(--n600); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--n300); background: #fff; color: var(--navy); font-size: 15px; font-weight: 500;
    padding: 7px 16px; border-radius: var(--radius-pill); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--navy); }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip .n { opacity: .6; font-weight: 400; margin-left: 4px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px; }

  /* Buttons (style guide: pill, primary orange fill / secondary orange outline) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; border-radius: var(--radius-pill); font-weight: 500; line-height: 1.2; transition: filter .15s, background .15s, color .15s; }
  .btn-primary { background: var(--orange); color: #fff; border: 0; padding: 10px 26px; font-size: 16px; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: #fff; color: var(--orange-bright); border: 2px solid var(--orange-bright); padding: 6px 18px; font-size: 14px; }
  .btn-secondary:hover { background: var(--orange-bright); color: #fff; }

  /* Rubric area nav */
  .areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 8px 0 0; padding: 0; list-style: none; }
  .area-btn {
    width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--n300); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    color: var(--navy); font-size: 15px; font-weight: 500; line-height: 1.25; transition: border-color .15s, box-shadow .15s;
  }
  .area-btn:hover { border-color: var(--blue); }
  .area-btn .count { flex: none; font-size: 13px; font-weight: 600; color: var(--n600); background: var(--n200); border-radius: var(--radius-pill); padding: 2px 9px; }
  .area-btn[aria-current="true"] { border-color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); background: #F2F7FF; }
  .area-btn[aria-current="true"] .count { background: var(--blue); color: #fff; }
  .area-btn[disabled] { opacity: .45; cursor: default; }

  /* Area section */
  .area-head { margin: 40px 0 20px; padding-top: 28px; border-top: 1px solid var(--n300); }
  h2 { font-family: var(--font-head); font-weight: 600; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; letter-spacing: -1px; margin: 0; color: var(--n800); }
  .area-desc { font-size: 18px; max-width: 760px; margin: 10px 0 14px; }
  .area-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 15px; color: var(--n600); }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding: 0; margin: 0 0 56px; list-style: none; }
  .card {
    background: #fff; border: 1px solid var(--n300); border-radius: var(--radius-card); padding: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 12px; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(18,38,52,.10); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 3px 10px; border-radius: var(--radius-pill); }
  .badge-lang { background: #E6F0FF; color: var(--blue); }
  .dur { font-size: 14px; color: var(--n600); display: inline-flex; align-items: center; gap: 5px; }
  .card h3 { font-family: var(--font-body); font-size: 18px; font-weight: 600; margin: 0; color: var(--n800); }
  .focus { font-size: 14px; color: var(--n600); margin: -6px 0 0; }
  .also { font-size: 13px; color: var(--n600); }
  .also-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { border: 1px solid var(--n300); background: var(--n200); color: var(--n700); font-size: 12px; padding: 3px 9px; border-radius: var(--radius-pill); cursor: pointer; }
  .tag:hover { border-color: var(--blue); color: var(--blue); }
  .card .btn-primary { margin-top: auto; align-self: flex-start; font-size: 15px; padding: 9px 22px; }
  .empty { background: var(--n200); border-radius: var(--radius-card); padding: 32px; text-align: center; color: var(--n600); margin-bottom: 56px; }

  /* Footer */
  footer { background: var(--navy); color: #C9D2DA; font-size: 14px; padding: 32px 0; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; }
  footer strong { color: #fff; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--n800); color: #fff; padding: 10px 18px; border-radius: var(--radius-pill); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    body { font-size: 17px; }
    .wrap { padding: 0 16px; }
    .hero { padding: 32px 0 28px; }
    .lede { font-size: 18px; }
    .areas { grid-template-columns: 1fr 1fr; }
    .area-btn { font-size: 14px; padding: 10px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

/* ---------- state ---------- */
const state = { ui: "en", lang: "ALL", area: 0 };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const clips = CLIPS.map(([id, lang, areas, _rt, min]) => ({
  id, lang, min, areas: areas.split("").map(Number),
}));
const $ = s => document.querySelector(s);
const t = k => T[state.ui][k];
const areaName = i => AREAS[i][state.ui];
const areaShort = i => AREAS[i][state.ui === "en" ? "shortEn" : "shortEs"] || areaName(i);
const mmss = m => { const s = Math.round(m * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const langName = c => (LANGS[c] || { en: c, es: c })[state.ui];
const driveUrl = id => `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const a = AREAS.findIndex(x => x.slug === p.get("area"));
  if (a >= 0) state.area = a;
  const l = (p.get("lang") || "").toUpperCase();
  if (l && (l === "ALL" || LANGS[l])) state.lang = l;
  const ui = p.get("ui");
  if (ui === "en" || ui === "es") state.ui = ui;
}
function writeHash() {
  const p = new URLSearchParams();
  p.set("area", AREAS[state.area].slug);
  if (state.lang !== "ALL") p.set("lang", state.lang);
  if (state.ui !== "en") p.set("ui", state.ui);
  history.replaceState(null, "", "#" + p.toString());
}

function filtered(area) {
  return clips.filter(c =>
    (state.lang === "ALL" || c.lang === state.lang) &&
    (area === undefined || c.areas.includes(area)));
}

/* ---------- render ---------- */
function renderStatic() {
  document.documentElement.lang = state.ui;
  document.title = `${t("title")} · TalkAbroad`;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t(el.dataset.t);
    if (el.dataset.t === "notice") el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".ui-lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ui === state.ui)));
}

function renderLangs() {
  const base = clips;
  const counts = {};
  base.forEach(c => counts[c.lang] = (counts[c.lang] || 0) + 1);
  const order = Object.keys(LANGS).filter(k => counts[k]).sort((a, b) => counts[b] - counts[a]);
  const items = [["ALL", t("all"), base.length], ...order.map(k => [k, langName(k), counts[k]])];
  $("#langs").innerHTML = items.map(([k, label, n]) =>
    `<button type="button" class="chip" data-lang="${k}" aria-pressed="${state.lang === k}">${esc(label)}<span class="n">${n}</span></button>`).join("");
}

function renderAreas() {
  $("#areas").innerHTML = AREAS.map((a, i) => {
    const n = filtered(i).length;
    return `<li><button type="button" class="area-btn" data-area="${i}" aria-current="${state.area === i}" ${n ? "" : "disabled"}>
      <span>${esc(areaShort(i))}</span><span class="count">${n}</span></button></li>`;
  }).join("");
}

function renderSection() {
  const a = AREAS[state.area];
  $("#area-title").textContent = areaName(state.area);
  $("#area-desc").textContent = state.ui === "en" ? a.dEn : a.dEs;

  // Most focused examples first (fewest other areas), then shortest.
  const list = filtered(state.area).sort((x, y) => x.areas.length - y.areas.length || x.min - y.min);
  const where = state.lang === "ALL" ? "" : t("inLang")(langName(state.lang));
  $("#area-meta").innerHTML = `<span>${esc(t("clips")(list.length) + where)}</span>`;

  if (!list.length) {
    $("#grid").innerHTML = `<li class="empty" style="grid-column:1/-1">${esc(t("empty"))}</li>`;
    return;
  }
  $("#grid").innerHTML = list.map((c, i) => {
    const others = c.areas.filter(x => x !== state.area);
    const also = others.length
      ? `<div class="also">${esc(t("also"))}<div class="also-list">${others.map(o =>
          `<button type="button" class="tag" data-area="${o}">${esc(areaShort(o))}</button>`).join("")}</div></div>`
      : `<p class="focus">${esc(t("focusOnly"))}</p>`;
    const label = `${t("example")} ${i + 1}`;
    return `<li class="card">
      <div class="card-top">
        <span class="badge badge-lang">${esc(langName(c.lang))}</span>
        <span class="dur"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>${mmss(c.min)}</span>
      </div>
      <h3>${esc(label)}</h3>
      ${also}
      <a class="btn btn-primary" href="${driveUrl(c.id)}" target="_blank" rel="noopener noreferrer"
         aria-label="${esc(`${t("watch")}: ${label}, ${langName(c.lang)}, ${mmss(c.min)}`)}">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>${esc(t("watch"))}
      </a>
    </li>`;
  }).join("");
}

function render() {
  // Keep the selected area valid for the current filters.
  if (!filtered(state.area).length) {
    const first = AREAS.findIndex((_, i) => filtered(i).length);
    if (first >= 0) state.area = first;
  }
  renderStatic(); renderLangs(); renderAreas(); renderSection();
  writeHash();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const ui = e.target.closest("[data-ui]");
  if (ui) { state.ui = ui.dataset.ui; store.set("cel-ui", state.ui); return render(); }
  const lang = e.target.closest("[data-lang]");
  if (lang) { state.lang = lang.dataset.lang; store.set("cel-lang", state.lang); return render(); }
  const area = e.target.closest("[data-area]");
  if (area && !area.disabled) {
    state.area = Number(area.dataset.area); render();
    if (area.classList.contains("tag") || window.innerWidth < 760) {
      const y = $("#area-section").getBoundingClientRect().top + window.scrollY - 76; // below sticky header
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  }
});
$("#copy-link").addEventListener("click", async () => {
  writeHash();
  try { await navigator.clipboard.writeText(location.href); }
  catch (e) {
    const ta = Object.assign(document.createElement("textarea"), { value: location.href });
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (err) {}
    ta.remove();
  }
  const toast = $("#toast"); toast.textContent = t("copied"); toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1600);
});
window.addEventListener("hashchange", () => { readHash(); render(); });

/* ---------- start ---------- */
const savedUi = store.get("cel-ui"); if (savedUi === "en" || savedUi === "es") state.ui = savedUi;
else if ((navigator.language || "").toLowerCase().startsWith("es")) state.ui = "es";
const savedLang = store.get("cel-lang"); if (savedLang && (savedLang === "ALL" || LANGS[savedLang])) state.lang = savedLang;
readHash();   // a shared link always wins over saved preferences
render();
</script>
